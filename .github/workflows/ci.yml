name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, check & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Run in the official Playwright image so browsers come preinstalled: `playwright install`
    # hangs at 100% downloading from the CDN on the hosted runner. Tag must match the
    # @playwright/test version in package-lock.json. Lint runs in the same container so a
    # single `npm ci` installs dependencies once and node_modules is reused by every step.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (once, reused for all steps)
        run: npm ci

      - name: Run lint & format check
        run: npm run lint

      - name: Run tests
        run: npm test
